<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Investment Research Copilot</title>
  <link rel="stylesheet" href="/style.css" />
  <script>
    // Applied before first paint so a stored setting never flashes.
    (function () {
      var stored = localStorage.getItem("copilot-theme");
      var themes = ["terminal", "light", "microfilm"];
      document.documentElement.setAttribute(
        "data-theme", themes.indexOf(stored) === -1 ? "terminal" : stored
      );
    })();
  </script>
</head>
<body>
  <header class="masthead">
    <button id="rail-toggle" class="rail-toggle" aria-expanded="false" aria-controls="rail">Desk</button>

    <div class="wordmark">
      <span class="wordmark-eyebrow">Equity desk</span>
      <h1>Research Copilot</h1>
    </div>

    <p class="stamp-badge" aria-label="This tool is read-only and has no execution path">
      <span>Read only</span>
      <span>No execution</span>
    </p>

    <button id="theme-toggle" class="theme-toggle" type="button">Terminal</button>
  </header>

  <div class="app">
    <aside class="rail" id="rail">
      <section class="block">
        <h2 class="block-label">Chats</h2>
        <button id="new-chat-btn" class="new-chat-btn">Start a new chat</button>
        <div id="chat-list" class="chat-list"><p class="block-note">Loading…</p></div>
        <p class="block-note">Chats are deleted after a week without activity.</p>
      </section>

      <section class="block">
        <h2 class="block-label">Portfolio</h2>
        <div id="portfolio" class="portfolio"><p class="block-note">Loading…</p></div>
      </section>

      <section class="block">
        <h2 class="block-label">Watchlist</h2>
        <form id="watchlist-form" class="watchlist-form">
          <input id="watchlist-ticker" type="text" placeholder="Add a ticker" maxlength="10" autocomplete="off" aria-label="Ticker to add to watchlist" />
          <button type="submit">Add</button>
        </form>
        <div id="watchlist" class="watchlist"><p class="block-note">Loading…</p></div>
      </section>

      <section class="block">
        <h2 class="block-label">Try asking</h2>
        <ul class="prompts">
          <li><button type="button" data-prompt="Analyze my current holdings by quality, leverage, valuation, and concentration.">Analyze my holdings</button></li>
          <li><button type="button" data-prompt="Summarize the main risks across my portfolio.">Summarize portfolio risks</button></li>
          <li><button type="button" data-prompt="Compare MSFT to peers.">Compare MSFT to peers</button></li>
          <li><button type="button" data-prompt="Explain why Nike's margins changed using its 10-K.">Explain NKE's margins</button></li>
          <li><button type="button" data-prompt="What litigation risk does JNJ disclose?">JNJ litigation risk <span class="prompt-src">live EDGAR</span></button></li>
        </ul>
      </section>
    </aside>

    <main class="main">
      <div id="log" class="log" aria-live="polite"><p class="block-note">Loading…</p></div>

      <form id="ask-form" class="ask-form">
        <label class="sr-only" for="question">Research question</label>
        <textarea id="question" placeholder="Ask a research question" rows="1"></textarea>
        <button type="submit" id="send-btn">Research</button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
